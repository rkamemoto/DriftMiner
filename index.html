<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drift Miner Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="Game status">
        <div>
          <p class="eyebrow">Drift Miner</p>
          <h1>Mine, haul, upgrade, descend.</h1>
        </div>
        <div class="stats-grid">
          <div>
            <span>Depth</span>
            <strong id="depthStat">0m</strong>
          </div>
          <div>
            <span>Cargo</span>
            <strong id="cargoStat">0 / 6</strong>
          </div>
          <div>
            <span>Drill Damage</span>
            <strong id="healthStat">0%</strong>
          </div>
          <div>
            <span>Upgrades</span>
            <strong id="upgradeStat">0</strong>
          </div>
        </div>
      </section>

      <section class="play-area" aria-label="Mining game">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
        <aside class="panel">
          <div class="panel-section">
            <h2>Upgrades</h2>
            <button class="upgrade" data-upgrade="power">
              <span>Drill Power</span>
              <strong id="powerCost">25c</strong>
            </button>
            <button class="upgrade" data-upgrade="speed">
              <span>Thruster Speed</span>
              <strong id="speedCost">20c</strong>
            </button>
            <button class="upgrade" data-upgrade="capacity">
              <span>Cargo Bay</span>
              <strong id="capacityCost">30c</strong>
            </button>
            <button class="upgrade" data-repair="drill">
              <span>Repair Drill</span>
              <strong id="repairCost">3 copper</strong>
            </button>
          </div>

          <div class="panel-section" id="relicPanel" hidden>
            <h2>Relics</h2>
            <button class="upgrade relic-control" data-relic="impact">
              <span>Impact Drill</span>
              <strong id="impactStatus">Locked</strong>
            </button>
            <button class="upgrade relic-control" data-relic="speed">
              <span>Speed Burst</span>
              <strong id="speedStatus">Locked</strong>
            </button>
            <button class="upgrade relic-control" data-relic="flare">
              <span>Flare</span>
              <strong id="flareStatus">Locked</strong>
            </button>
            <button class="upgrade relic-control" data-relic="blaster">
              <span>Blaster</span>
              <strong id="blasterStatus">Locked</strong>
            </button>
            <button class="upgrade relic-control" data-relic="bomb">
              <span>Bomb</span>
              <strong id="bombStatus">Locked</strong>
            </button>
            <button class="upgrade relic-control" data-relic="mouse">
              <span>Mouse</span>
              <strong id="mouseStatus">Locked</strong>
            </button>
            <button class="upgrade relic-control" data-relic="dog">
              <span>Dog</span>
              <strong id="dogStatus">Locked</strong>
            </button>
          </div>

          <div class="panel-section inventory">
            <h2>Storage</h2>
            <dl id="resourceList"></dl>
          </div>

          <div class="panel-section">
            <h2>Log</h2>
            <p id="messageLog">Launch from the pad and start digging.</p>
          </div>
        </aside>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
