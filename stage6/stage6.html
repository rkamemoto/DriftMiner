<!doctype html>

  <head>

    <title>Drift Miner: Landfall</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05080d; }
      body { display: flex; align-items: center; justify-content: center; }
      .s6-shell { position: relative; width: min(100vw, calc(100vh * 1.5)); aspect-ratio: 3 / 2; }
      #stageSixCanvas { display: block; width: 100%; height: 100%; background: #030711; image-rendering: auto; }
      .s6-home { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;

      .s6-home:hover { opacity: 1; }
      .s6-home, .s6-toggle { cursor: pointer; }
      .s6-toggle { position: absolute; top: 50px; right: 10px; width: 34px; height: 34px; padding: 0; box-sizing: content-box; border-radius: 8px; display: grid; place-items: center;
        background: rgba(8, 20, 28, .55); border: 1px solid rgba(104, 214, 199, .35); opacity: .45; transition: opacity .2s; }
      .s6-toggle:hover { opacity: 1; }
      .s6-music { top: 90px; }
      .s6-toggle .off, .s6-toggle.muted .on { display: none; }
      .s6-toggle.muted .off { display: inline; }
      .s6-home svg, .s6-toggle svg { width: 18px; height: 18px; stroke: #68d6c7; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
